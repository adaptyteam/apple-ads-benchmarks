name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Data contract
        run: node scripts/validate-data.mjs
      - name: Skill behavior contract
        run: node scripts/validate-skill.mjs
      - name: Build plugin
        run: bash scripts/pack-plugin.sh /tmp/apple-ads-benchmarks.plugin
      - name: Plugin bundle contract
        run: node scripts/validate-package.mjs /tmp/apple-ads-benchmarks.plugin
